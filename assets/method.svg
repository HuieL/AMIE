<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 408" width="768" height="408" role="img" aria-labelledby="amie-method-title amie-method-desc">
  <title id="amie-method-title">AMIE access-state loop</title>
  <desc id="amie-method-desc">A query goes through the host retriever, AMIE rescores the candidates with the persistent access state, the answer context is sealed for the answerer, and only afterwards does the access policy commit the feedback mask that updates the state.</desc>
  <style>
    :root {
      --paper: #f5f5f5; --node: #ffffff; --ink: #2d3142; --muted: #4f5d75;
      --soft: #5a6580; --accent: #bf4520; --atint: rgba(191,69,32,.08);
      --store: rgba(45,49,66,.05); --input: rgba(79,93,117,.10);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #2d3142; --node: #393e53; --ink: #f5f5f5; --muted: #bfc0c0;
        --soft: #949eb2; --accent: #f08a59; --atint: rgba(240,138,89,.10);
        --store: rgba(245,245,245,.05); --input: rgba(191,192,192,.12);
      }
    }
    .bg { fill: var(--paper); }
    .bx-node { fill: var(--node); stroke: var(--ink); }
    .bx-focal { fill: var(--atint); stroke: var(--accent); stroke-width: 1.2; }
    .bx-store { fill: var(--store); stroke: var(--muted); }
    .bx-input { fill: var(--input); stroke: var(--soft); }
    .nm { font: 600 12px 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif; fill: var(--ink); }
    .sl { font: 400 9px 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace; fill: var(--soft); letter-spacing: .04em; }
    .eb { font: 500 8px 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace; fill: var(--soft); letter-spacing: .18em; }
    .al { font: 400 8px 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace; fill: var(--muted); letter-spacing: .06em; }
    .ala { font: 400 8px 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace; fill: var(--accent); letter-spacing: .06em; }
    .co { font: italic 400 13px 'Instrument Serif', Georgia, serif; fill: var(--soft); }
    .lg { font: 400 8px 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace; fill: var(--soft); letter-spacing: .06em; }
    .mk { fill: var(--paper); }
    .ar { stroke: var(--muted); stroke-width: 1; fill: none; }
    .ara { stroke: var(--accent); stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="amie-method-am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
    </marker>
    <marker id="amie-method-aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="768" height="408"/>
  <line class="ar" x1="120" y1="96" x2="164" y2="96" marker-end="url(#amie-method-am)"/>
  <rect class="mk" x="121" y="75" width="46" height="14" rx="2"/>
  <text class="al" x="144" y="85" text-anchor="middle">RETRIEVE</text>

  <line class="ar" x1="304" y1="96" x2="356" y2="96" marker-end="url(#amie-method-am)"/>
  <rect class="mk" x="309" y="75" width="46" height="14" rx="2"/>
  <text class="al" x="332" y="85" text-anchor="middle">SCORES σ</text>

  <line class="ara" x1="512" y1="96" x2="564" y2="96" marker-end="url(#amie-method-aa)"/>
  <line class="ara" x1="536" y1="90" x2="536" y2="106"/>
  <line class="ara" x1="544" y1="90" x2="544" y2="106"/>
  <rect class="mk" x="522" y="75" width="36" height="14" rx="2"/>
  <text class="ala" x="540" y="85" text-anchor="middle">SEALED</text>

  <path class="ar" d="M236,128 L236,260" marker-end="url(#amie-method-am)"/>
  <rect class="mk" x="244" y="182" width="76" height="14" rx="2"/>
  <text class="al" x="282" y="192" text-anchor="middle">NATIVE TOP-10</text>

  <line class="ar" x1="320" y1="296" x2="356" y2="296" marker-end="url(#amie-method-am)"/>
  <rect class="mk" x="322" y="275" width="36" height="14" rx="2"/>
  <text class="al" x="340" y="285" text-anchor="middle">COMMIT</text>

  <path class="ar" d="M440,264 L440,132" marker-end="url(#amie-method-am)"/>
  <rect class="mk" x="448" y="182" width="36" height="14" rx="2"/>
  <text class="al" x="466" y="192" text-anchor="middle">U(T+1)</text>
  <text class="eb" x="24" y="56">QUESTION</text>
  <rect class="bx-input" x="24" y="64" width="96" height="64" rx="6"/>
  <text class="nm" x="72" y="92" text-anchor="middle">Query</text>
  <text class="sl" x="72" y="110" text-anchor="middle">ONE QUESTION</text>

  <text class="eb" x="168" y="56">HOST</text>
  <rect class="bx-node" x="168" y="64" width="136" height="64" rx="6"/>
  <text class="nm" x="236" y="92" text-anchor="middle">Host retriever</text>
  <text class="sl" x="236" y="110" text-anchor="middle">TOP-K · POOL=100</text>

  <text class="eb" x="360" y="56">OPERATOR</text>
  <rect class="bx-focal" x="360" y="64" width="152" height="64" rx="6"/>
  <text class="nm" x="436" y="92" text-anchor="middle">AMIE rescore</text>
  <text class="sl" x="436" y="110" text-anchor="middle">S=σ·(1−0.5·U_I)</text>

  <text class="eb" x="568" y="56">GENERATOR</text>
  <rect class="bx-node" x="568" y="64" width="136" height="64" rx="6"/>
  <text class="nm" x="636" y="92" text-anchor="middle">Answerer</text>
  <text class="sl" x="636" y="110" text-anchor="middle">QWEN3-32B</text>

  <text class="eb" x="168" y="248">POLICY</text>
  <rect class="bx-node" x="168" y="264" width="152" height="64" rx="6"/>
  <text class="nm" x="244" y="292" text-anchor="middle">Policy π</text>
  <text class="sl" x="244" y="310" text-anchor="middle">COUNT · FROZEN · TRAINED</text>

  <text class="eb" x="360" y="248">STATE</text>
  <rect class="bx-store" x="360" y="264" width="160" height="64" rx="6"/>
  <text class="nm" x="440" y="292" text-anchor="middle">Access state u</text>
  <text class="sl" x="440" y="310" text-anchor="middle">U_I=N_I/(N_I+3)</text>
  <text class="co" x="568" y="176">the answer context is sealed</text>
  <text class="co" x="568" y="194">before any state update commits</text>
  <rect class="bx-focal" x="24" y="376" width="16" height="16" rx="2"/>
  <text class="lg" x="48" y="388">AMIE OPERATOR</text>
  <rect class="bx-store" x="152" y="376" width="16" height="16" rx="2"/>
  <text class="lg" x="176" y="388">PERSISTENT STATE</text>
  <rect class="bx-node" x="288" y="376" width="16" height="16" rx="2"/>
  <text class="lg" x="312" y="388">HOST / MODELS</text>
  <line class="ara" x1="416" y1="384" x2="444" y2="384" marker-end="url(#amie-method-aa)"/>
  <text class="lg" x="452" y="388">SEALED CONTEXT</text>
  <line class="ar" x1="556" y1="384" x2="584" y2="384" marker-end="url(#amie-method-am)"/>
  <text class="lg" x="592" y="388">DATA / FEEDBACK</text>
</svg>
